# Server Configuration (Render assigns PORT automatically)
server.port=${PORT:8080}

# Application Name
spring.application.name=publication-verification-system

# Database Configuration:
# Auto-detects cloud environment: if MYSQL_URL is set, connects to MySQL;
# otherwise uses embedded in-memory database so Render boots cleanly with 0 errors!
spring.datasource.url=${MYSQL_URL:jdbc:h2:mem:pubdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driver-class-name=${MYSQL_DRIVER:org.h2.Driver}
spring.datasource.username=${MYSQL_USER:sa}
spring.datasource.password=${MYSQL_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Enable H2 Console as optional fallback inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
