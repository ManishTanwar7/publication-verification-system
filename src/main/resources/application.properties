# Server Configuration (Render assigns PORT automatically)
server.port=${PORT:8080}

# Application Name
spring.application.name=publication-verification-system

# Database Configuration (Auto-switches to MySQL if environment variables are provided, else uses embedded DB)
spring.datasource.url=${MYSQL_URL:jdbc:h2:mem:pubdb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${MYSQL_DRIVER:org.h2.Driver}
spring.datasource.username=${MYSQL_USER:sa}
spring.datasource.password=${MYSQL_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Console for inspection (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
